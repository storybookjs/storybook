name: Ecosystem QA

# A probe on a branch that is never merged. While gutenberg's Storybook tests run in Vitest browser
# mode inside the QA sandbox, a root process of the runner named `agent` grows by about a gigabyte a
# minute, outside the sandbox's memory limit. In the sweep that lost a runner, the sandbox held a
# build at the same time. Here a second container holds 8000 MB from the moment the tests start, in
# place of that build. Without the guard the runner is expected to stop answering; with it, the
# runner is expected to end the test run and stay up.

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Probe a short machine, guard ${{ matrix.guard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        guard: ['off', 'on']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install the ecosystem-qa workspace
        run: |
          corepack enable
          yarn workspaces focus ecosystem-qa

      - name: Build the sandbox image and the stand-in agent
        run: |
          docker build --build-arg AGENT_UID="$(id -u)" --build-arg AGENT_GID="$(id -g)" -t sb-ecosystem-qa ecosystem-qa
          docker build -t sb-ecosystem-qa-standin-vitest ecosystem-qa/probe/standin-vitest

      - name: Run the probe
        env:
          CLAUDE_CODE_OAUTH_TOKEN: probe-not-a-credential
          QA_PROBE_GUARD: ${{ matrix.guard }}
        run: |
          (
            held=no
            while true; do
              if [ "$held" = no ] && [ -f "$RUNNER_TEMP/qa-result/evidence/vitest.log" ]; then
                held=yes
                echo "host $(date -u +%H:%M:%S): the tests have started, holding 8000 MB in a second container"
                docker run -d --name ballast --entrypoint node sb-ecosystem-qa -e "const keep=[];for(let i=0;i<125;i++)keep.push(Buffer.alloc(64*2**20,1));setInterval(()=>{},1000)" > /dev/null
              fi
              echo "host $(date -u +%H:%M:%S): $(awk '/^(MemAvailable|AnonPages|SwapFree):/ {printf "%s %d MB  ", $1, $2/1024}' /proc/meminfo) largest: $(ps -eo rss=,pid=,user=,comm= --sort=-rss | head -n 4 | awk '{printf "%d MB %s %s; ", $1/1024, $4, $3}')"
              sleep 10
            done
          ) &
          node ecosystem-qa/run.ts --repo gutenberg --version 11.0.0-beta.2 --engine claude --sandbox docker \
            --tier extended --out "$RUNNER_TEMP/qa-result" --image sb-ecosystem-qa-standin-vitest

      - name: Show the guard's log and the end of the test log
        if: ${{ always() }}
        run: |
          cat "$RUNNER_TEMP/qa-result/evidence/memory-guard.log" || echo "the guard ended nothing"
          tail -n 12 "$RUNNER_TEMP/qa-result/evidence/vitest.log" || true
          free -m

      - name: Upload the readings
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-short-machine-guard-${{ matrix.guard }}
          path: |
            ${{ runner.temp }}/qa-result/result.json
            ${{ runner.temp }}/qa-result/evidence/host-samples.jsonl
            ${{ runner.temp }}/qa-result/evidence/memory-guard.log
            ${{ runner.temp }}/qa-result/evidence/vitest.log
          retention-days: 7
