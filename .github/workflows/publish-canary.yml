name: Publish Canary Packages

on:
  # Manual run from the Actions UI or `gh workflow run`. Select any branch.
  workflow_dispatch:
  push:
    branches: [next]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish-canary:
    name: Publish Canary Packages
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event.pull_request.state == 'open' &&
        contains(github.event.pull_request.labels.*.name, 'ci:canary') &&
        (github.event.action != 'labeled' || github.event.label.name == 'ci:canary')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Build Canary Release Status
        id: canary-status
        if: ${{ github.event_name == 'pull_request' }}
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "run_url=https://github.com/$REPOSITORY/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "pkg_pr_new_page=https://pkg.pr.new/~/storybookjs/storybook" >> "$GITHUB_OUTPUT"

      - name: Checkout Pull Request Head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: 'Update Canary Release Heading: Pending'
        id: replace-canary-heading-pending
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ steps.canary-status.outputs.run_url }}
        run: |
          printf '## 🦋 Canary Release - ⏳ [Pending](%s)\n' "$RUN_URL" > "$RUNNER_TEMP/canary-heading.md"
          node .github/scripts/replace-pr-body-markers.ts \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --marker CANARY_RELEASE_HEADING "$RUNNER_TEMP/canary-heading.md"

      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-and-install
        with:
          install-code-deps: true

      - name: Build
        working-directory: code
        run: yarn task --task compile --start-from=auto --no-link

      - name: Publish
        id: publish
        working-directory: scripts
        run: |
          # --yarn uses `yarn pack`, which rewrites leftover workspace: ranges
          # (npm pack leaves them; npm install then fails with EUNSUPPORTEDPROTOCOL).
          yarn workspaces list --json --no-private \
            | jq -j '"../" + .location + "\u0000"' \
            | xargs -0 -r yarn pkg-pr-new publish --yarn --no-template --comment=off --json=./pkg-pr-new-output.json

          test -s ./pkg-pr-new-output.json

          create_storybook_package_url=$(jq -er '.packages[] | select(.name == "create-storybook") | .url' ./pkg-pr-new-output.json)
          storybook_package_url=$(jq -er '.packages[] | select(.name == "storybook") | .url' ./pkg-pr-new-output.json)
          react_vite_package_url=$(jq -er '.packages[] | select(.name == "@storybook/react-vite") | .url' ./pkg-pr-new-output.json)

          {
            echo "create_storybook_package_url=$create_storybook_package_url"
            echo "storybook_package_url=$storybook_package_url"
            echo "react_vite_package_url=$react_vite_package_url"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Canary Install Commands
        id: verify-canary-commands
        if: ${{ github.event_name == 'pull_request' && steps.publish.outcome == 'success' }}
        env:
          CREATE_STORYBOOK_PACKAGE_URL: ${{ steps.publish.outputs.create_storybook_package_url }}
          STORYBOOK_PACKAGE_URL: ${{ steps.publish.outputs.storybook_package_url }}
          REACT_VITE_PACKAGE_URL: ${{ steps.publish.outputs.react_vite_package_url }}
        run: |
          # npm 12+ defaults allow-remote to none. Run from an empty directory so
          # `storybook --help` does not resolve packages through this repo's Yarn.
          assertion_dir=$(mktemp -d)
          (
            cd "$assertion_dir"
            npx --yes --allow-remote=all "$CREATE_STORYBOOK_PACKAGE_URL" --help
            npx --yes --allow-remote=all "$STORYBOOK_PACKAGE_URL" --help
          )

          # Frameworks declare storybook as workspace:^. yarn pack must rewrite that
          # before upload; otherwise npm install fails with EUNSUPPORTEDPROTOCOL.
          curl -fsSL "$REACT_VITE_PACKAGE_URL" -o "$assertion_dir/react-vite.tgz"
          mkdir -p "$assertion_dir/react-vite"
          tar -xzf "$assertion_dir/react-vite.tgz" -C "$assertion_dir/react-vite"
          if grep -F 'workspace:' "$assertion_dir/react-vite/package/package.json"; then
            echo "Canary tarball still contains workspace: protocol" >&2
            exit 1
          fi

      - name: Build Canary Release Content
        id: canary-content
        if: ${{ github.event_name == 'pull_request' && steps.verify-canary-commands.outcome == 'success' }}
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PKG_PR_NEW_PAGE: ${{ steps.canary-status.outputs.pkg_pr_new_page }}
          CREATE_STORYBOOK_PACKAGE_URL: ${{ steps.publish.outputs.create_storybook_package_url }}
          STORYBOOK_PACKAGE_URL: ${{ steps.publish.outputs.storybook_package_url }}
        run: |
          short_sha="${COMMIT_SHA:0:7}"

          printf '## 🦋 Canary Release - 🚢 Released [`%s`](%s)\n' "$short_sha" "$PKG_PR_NEW_PAGE" > "$RUNNER_TEMP/canary-heading.md"

          # Quote the markdown fence. An unquoted ``` in this heredoc is
          # command substitution and would run the npx lines in this repo.
          cat > "$RUNNER_TEMP/canary-body.md" <<EOF
          This pull request has been released as canary packages. Try it out in a new project or update an existing project with the commands below.

          \`\`\`sh
          # For a new project
          npx --yes --allow-remote=all ${CREATE_STORYBOOK_PACKAGE_URL}

          # or for an existing project
          npx --yes --allow-remote=all ${STORYBOOK_PACKAGE_URL} upgrade
          \`\`\`
          EOF

      - name: Update Canary Release Heading and Body
        id: replace-pr-body
        if: ${{ github.event_name == 'pull_request' && steps.canary-content.outcome == 'success' && steps.verify-canary-commands.outcome == 'success' }}
        continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node .github/scripts/replace-pr-body-markers.ts \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --marker CANARY_RELEASE_HEADING "$RUNNER_TEMP/canary-heading.md" \
            --marker CANARY_RELEASE_SECTION "$RUNNER_TEMP/canary-body.md"

      - name: 'Update Canary Release Heading: Failed'
        id: replace-canary-heading-failed
        if: ${{ github.event_name == 'pull_request' && failure() && steps.replace-pr-body.outcome != 'success' }}
        continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PKG_PR_NEW_PAGE: ${{ steps.canary-status.outputs.pkg_pr_new_page }}
        run: |
          short_sha="${COMMIT_SHA:0:7}"
          printf '## 🦋 Canary Release - 💥 Failed [`%s`](%s)\n' "$short_sha" "$PKG_PR_NEW_PAGE" > "$RUNNER_TEMP/canary-heading.md"
          node .github/scripts/replace-pr-body-markers.ts \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --marker CANARY_RELEASE_HEADING "$RUNNER_TEMP/canary-heading.md"

      - name: Create Failure Comment on PR
        if: ${{ github.event_name == 'pull_request' && failure() && steps.replace-pr-body.outcome != 'success' }}
        continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body "Failed to publish canary packages for this pull request, triggered by @$TRIGGERING_ACTOR. See the failed workflow run at: https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
