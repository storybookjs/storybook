name: Agent eval

on:
  schedule:
    # Weekly full 8xx/82x suite on `next` (repo default). Monday 08:00 UTC.
    - cron: '0 8 * * 1'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number for the eval gate thread (optional; inferred from the branch if omitted)'
        type: string
        default: ''
      eval_only:
        description: 'Comma-separated eval names to run (overrides extra_evals), e.g. 803-edit-component'
        type: string
        default: ''
      extra_evals:
        description: 'Run the full 8xx eval line instead of only the default eval'
        type: boolean
        default: false
      extra_models:
        description: 'Also run evals for non-default model experiments (e.g. cc-plugin-sonnet-medium)'
        type: boolean
        default: false
      storybook_latest:
        description: 'Install Storybook and @storybook/addon-mcp from the npm latest tag instead of the next tag and local build'
        type: boolean
        default: false
      review:
        description: 'Enable the experimentalReview feature flag in eval sandboxes and assert the review workflow'
        type: boolean
        default: false

concurrency:
  group: agent-eval-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_PROJECT_NAME: storybook-evals

jobs:
  eval:
    name: Run agent eval experiments
    # Skip synchronize: sticky `ci:eval` must not re-bill on every push.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.action != 'synchronize' &&
        !github.event.pull_request.head.repo.fork &&
        contains(github.event.pull_request.labels.*.name, 'ci:eval'))
    runs-on: ubuntu-latest
    environment:
      # Keep this rule in sync with the Resolve Vercel target step below.
      # GitHub evaluates environment.name before step outputs exist.
      name: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/next' && 'production' || 'preview' }}
      url: ${{ steps.deploy_playground.outputs.url }}
    permissions:
      # resolveReviewThread/unresolveReviewThread need contents: write on top
      # of pull-requests: write (403 with pull-requests alone; verified on a
      # disposable PR). No issues/labels are touched by this workflow.
      contents: write
      deployments: write
      pull-requests: write
    outputs:
      evaluated_head_sha: ${{ steps.gate_head.outputs.evaluated_head_sha }}
      gate_pr_number: ${{ steps.gate_pr.outputs.pr_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve PR for the eval gate thread
        id: gate_pr
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER_INPUT: ${{ github.event.pull_request.number || inputs.pr_number || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          pr="$PR_NUMBER_INPUT"
          if [[ -z "$pr" && "$EVENT_NAME" == "workflow_dispatch" ]]; then
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$GITHUB_REF_NAME" --json number --jq '.[0].number // empty')"
          fi
          if [[ -z "$pr" ]]; then
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "No PR for the eval gate thread (ok for next/schedule-style runs)."
            exit 0
          fi
          echo "pr_number=$pr" >> "$GITHUB_OUTPUT"

      # pull_request: the PR head (checkout may be the merge commit).
      # dispatch/schedule: the pushed ref head. Compared against the live PR
      # head at the end of the run so a late finish never resolves the thread
      # for a commit it did not evaluate.
      - name: Capture evaluated head SHA
        id: gate_head
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "evaluated_head_sha=${PR_HEAD_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # The single persistent merge-gate thread for ci:eval (first comment
      # carries the <!-- agent-eval-gate --> marker). Created before evals run;
      # a previously resolved thread is reopened and its body reset for this
      # head. Fatal on failure: without the thread there is no merge proof.
      - name: Create or update the eval gate thread
        id: gate_thread
        if: ${{ steps.gate_pr.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate_pr.outputs.pr_number }}
          EVALUATED_HEAD_SHA: ${{ steps.gate_head.outputs.evaluated_head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCOPE_EXTRA_EVALS: ${{ (inputs.extra_evals || contains(github.event.pull_request.labels.*.name, 'ci:extra-evals')) && 'ci:extra-evals' || '' }}
          SCOPE_EXTRA_MODELS: ${{ (inputs.extra_models || contains(github.event.pull_request.labels.*.name, 'ci:extra-models')) && 'ci:extra-models' || '' }}
          SCOPE_STORYBOOK_LATEST: ${{ (inputs.storybook_latest || contains(github.event.pull_request.labels.*.name, 'ci:storybook-latest')) && 'ci:storybook-latest' || '' }}
          SCOPE_REVIEW: ${{ (inputs.review || contains(github.event.pull_request.labels.*.name, 'ci:review')) && 'ci:review' || '' }}
        run: bash agent-eval/scripts/eval-gate-thread.sh ensure

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build local MCP packages
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: yarn nx run-many -t compile --projects mcp,addon-mcp

      - name: Type check agent eval config
        run: yarn workspace agent-eval run typecheck

      - name: Check playground route shims
        run: yarn workspace agent-eval run playground:check-routes

      - name: Validate Vercel credentials
        shell: bash
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          missing=0

          for name in VERCEL_PROJECT_ID VERCEL_TOKEN VERCEL_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing Vercel secret::$name is required for Vercel Sandbox evals and the preview playground deployment."
              missing=1
            fi
          done

          exit "$missing"

      - name: Run all experiments
        id: run_evals
        run: yarn workspace agent-eval run eval
        env:
          # Schedule always runs the full 8xx/82x line on next. PR labels and
          # workflow_dispatch inputs opt in otherwise; unlabeled ci:eval stays minimal.
          EVAL_ONLY: ${{ inputs.eval_only || '' }}
          EVAL_EXTRA_EVALS: ${{ (github.event_name == 'schedule' || inputs.extra_evals || contains(github.event.pull_request.labels.*.name, 'ci:extra-evals')) && '1' || '' }}
          EVAL_EXTRA_MODELS: ${{ (inputs.extra_models || contains(github.event.pull_request.labels.*.name, 'ci:extra-models')) && '1' || '' }}
          EVAL_STORYBOOK_LATEST: ${{ (inputs.storybook_latest || contains(github.event.pull_request.labels.*.name, 'ci:storybook-latest')) && '1' || '' }}
          EVAL_REVIEW: ${{ (inputs.review || contains(github.event.pull_request.labels.*.name, 'ci:review')) && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Check eval results
        if: ${{ always() }}
        id: check_results
        shell: bash
        run: |
          if [[ ! -d agent-eval/results ]]; then
            echo "::error title=Missing eval results::Expected agent-eval/results to exist before deploying the playground."
            exit 1
          fi

          if ! find agent-eval/results -type f -print -quit | grep -q .; then
            echo "::error title=No eval result files::Expected agent-eval/results to contain files before deploying the playground."
            exit 1
          fi

          echo "has_result_files=true" >> "$GITHUB_OUTPUT"

      - name: Archive eval results
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' }}
        # Tar before upload: result files may contain characters (e.g. the colon
        # in test:stories output names) that actions/upload-artifact rejects.
        run: tar -czf agent-eval-results.tgz -C agent-eval results

      - name: Upload eval results
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-eval-results
          path: agent-eval-results.tgz
          retention-days: 30

      - name: Resolve Vercel target
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' }}
        id: vercel_target
        shell: bash
        run: |
          # Keep this rule in sync with jobs.eval.environment.name above.
          if [[ ("$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "schedule") && "$GITHUB_REF" == "refs/heads/next" ]]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
          fi

      # Vercel CLI commands run from the repository root: the storybook-evals
      # project's Root Directory setting is agent-eval, and in a monorepo the
      # CLI must not be invoked from the subdirectory (vercel.com/docs/monorepos)
      # or `deploy --prebuilt` resolves trace paths against the wrong base.
      - name: Link Vercel project
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: ./agent-eval/node_modules/.bin/vercel link --yes --team "$VERCEL_TEAM_ID" --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN"

      - name: Pull Vercel environment
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' }}
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TARGET: ${{ steps.vercel_target.outputs.target }}
        run: |
          if [[ "$VERCEL_TARGET" == "production" ]]; then
            ./agent-eval/node_modules/.bin/vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          else
            branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            ./agent-eval/node_modules/.bin/vercel pull --yes --environment=preview --git-branch "$branch" --token "$VERCEL_TOKEN"
          fi

      - name: Build playground
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' }}
        id: build_playground
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TARGET: ${{ steps.vercel_target.outputs.target }}
        run: ./agent-eval/node_modules/.bin/vercel build --yes --target="$VERCEL_TARGET" --token "$VERCEL_TOKEN"

      - name: Deploy playground
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' && steps.build_playground.outcome == 'success' }}
        id: deploy_playground
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TARGET: ${{ steps.vercel_target.outputs.target }}
        run: |
          deploy_output="$(./agent-eval/node_modules/.bin/vercel deploy --prebuilt --yes --target="$VERCEL_TARGET" --token "$VERCEL_TOKEN")"
          printf '%s\n' "$deploy_output"

          url="$(
            printf '%s\n' "$deploy_output" |
              awk '/https:\/\/[^[:space:]]+\.vercel\.app/ { match($0, /https:\/\/[^[:space:]]+\.vercel\.app[^[:space:]]*/); if (RSTART) found=substr($0,RSTART,RLENGTH) } END { print found }'
          )"

          if [[ -z "$url" ]]; then
            echo "::error title=Missing deployment URL::Vercel deploy did not print a deployment URL."
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Update PR description with eval results
        if: ${{ always() && github.event_name == 'pull_request' && steps.check_results.outputs.has_result_files == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PLAYGROUND_URL: ${{ steps.deploy_playground.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary="$(node agent-eval/scripts/render-results-summary.mjs)"
          body="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')"

          printf '%s' "$body" |
            SUMMARY="$summary" node agent-eval/scripts/upsert-pr-eval-results.mjs |
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --field body=@- --silent

      - name: Write deployment summary
        if: ${{ always() && steps.deploy_playground.outcome == 'success' }}
        env:
          VERCEL_TARGET: ${{ steps.vercel_target.outputs.target }}
          PLAYGROUND_URL: ${{ steps.deploy_playground.outputs.url }}
        run: |
          {
            echo "### Agent eval playground"
            echo
            echo "- Target: \`$VERCEL_TARGET\`"
            echo "- Project: \`$VERCEL_PROJECT_NAME\`"
            echo "- URL: $PLAYGROUND_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # Weekly / next-dispatch signal to #team-storybook. Requires repo secret
      # SLACK_AGENT_EVAL_WEBHOOK_URL (Incoming Webhook into that channel).
      - name: Notify Slack
        if: >-
          always() &&
          !cancelled() &&
          (github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/next'))
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_AGENT_EVAL_WEBHOOK_URL }}
          PLAYGROUND_URL: ${{ steps.deploy_playground.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVAL_OUTCOME: ${{ steps.run_evals.outcome }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::warning title=Missing Slack webhook::SLACK_AGENT_EVAL_WEBHOOK_URL is not set; skipping #team-storybook notify."
            exit 0
          fi

          text="$(FORMAT=slack node agent-eval/scripts/render-results-summary.mjs)"
          payload="$(jq -n --arg text "$text" '{text: $text}')"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      # Terminal gate write: resolve the thread only when the successful run
      # evaluated the live PR head; stale, failed, cancelled, or skipped runs
      # keep it open with a summary. Runs even when earlier steps failed
      # (always() + !cancelled() + outcome checks) but never fails the job —
      # a thread mutation failure after evals is a warning + step-summary
      # note; re-dispatching the workflow retries it.
      - name: Update the eval gate thread with the result
        if: >-
          always() &&
          !cancelled() &&
          steps.gate_thread.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate_pr.outputs.pr_number }}
          EVALUATED_HEAD_SHA: ${{ steps.gate_head.outputs.evaluated_head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAYGROUND_URL: ${{ steps.deploy_playground.outputs.url }}
          EVAL_OUTCOME: ${{ steps.run_evals.outcome }}
        run: |
          summary_file="$(mktemp)"
          PLAYGROUND_URL="$PLAYGROUND_URL" RUN_URL="$RUN_URL" \
            node agent-eval/scripts/render-results-summary.mjs > "$summary_file" || true
          SUMMARY_FILE="$summary_file" bash agent-eval/scripts/eval-gate-thread.sh result

  # New push on a ci:eval PR: previous eval results no longer cover the head.
  # Pushes do not auto-reopen resolved review threads, so explicitly reopen
  # the gate thread WITHOUT rerunning evals (reruns stay label/dispatch-driven).
  reopen-eval-gate:
    name: Reopen eval gate thread on new commits
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      !github.event.pull_request.head.repo.fork &&
      contains(github.event.pull_request.labels.*.name, 'ci:eval')
    runs-on: ubuntu-latest
    permissions:
      # unresolveReviewThread needs contents: write + pull-requests: write.
      contents: write
      pull-requests: write
    steps:
      - name: Checkout eval gate script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: agent-eval/scripts

      - name: Reopen the eval gate thread for the new head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash agent-eval/scripts/eval-gate-thread.sh reopen
