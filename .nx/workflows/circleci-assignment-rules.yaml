# Assignment rules for the CircleCI agents of the NX DTE pipeline (scripts/ci/nx/circleci-dte.ts),
# which starts NX Cloud with `start-ci-run --distribute-on=manual`. Each agent sets
# NX_AGENT_LAUNCH_TEMPLATE to its pool's name below (NX_DTE_AGENTS in circleci-dte.ts says why there
# are two). See .nx/ci-config.yaml for why each agent runs one task at a time (plus the continuous
# tasks that task needs).
#
# NX Cloud applies one rule per task: the most specific, and of equally specific rules (these all
# match on targets only) the first. So the `*` rule comes last.
# https://nx.dev/docs/kb/assignment-rules
assignment-rules:
  # What the sandboxes need first, and the local registry that both pools' tasks start.
  - targets:
      - compile
      - publish
      - run-registry
    run-on:
      - agent: circleci-linux
        parallelism: 1
      - agent: circleci-linux-sandbox
        parallelism: 1
  # A sandbox's own tasks, with the dev and static servers its E2E tests start.
  - targets:
      - sandbox
      - build
      - dev
      - serve
      - e2e-tests
      - e2e-tests-dev*
      - chromatic
      - vitest-integration
      - smoke-test
      - docgen-baselines
    run-on:
      - agent: circleci-linux-sandbox
        parallelism: 1
  - targets:
      - '*'
    run-on:
      - agent: circleci-linux
        parallelism: 1
