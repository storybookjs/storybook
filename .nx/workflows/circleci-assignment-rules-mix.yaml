# Measurement only (the medium+ benchmark, NX_DTE_MODE `mix` in scripts/ci/nx/circleci-dte.ts):
# the dev-server E2E tests and the internal Storybook's dev E2E tests run only on the large agents
# (on medium+ they timed out or ran out of memory, as CircleCI's per-job pipeline found); every
# other task on either kind. Both rules name only targets, so the first one wins for those.
assignment-rules:
  - targets:
      - 'e2e-tests-dev*'
      - e2e-internal-1
      - e2e-internal-2
      - e2e-internal-3
      - e2e-internal-4
    run-on:
      - agent: circleci-linux-large
        parallelism: 1
  - targets:
      - '*'
    run-on:
      - agent: circleci-linux
        parallelism: 1
      - agent: circleci-linux-large
        parallelism: 1
