name: Publish Canary Packages

on:
  # Manual run from the Actions UI or `gh workflow run`. Select any branch.
  workflow_dispatch:
  push:
    branches: [next]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1

# Fork pull_request runs get a read-only token. Do not request pull-requests: write here; PR body
# updates live in publish-canary-pr-body.yml (`workflow_run`) so this job never holds a write token
# while compiling untrusted PR code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  # pkg.pr.new stores under GITHUB_REPOSITORY. A fork PR on this repo would
  # still publish as storybookjs/storybook. Skip those; publish from the fork
  # instead so URLs are pkg.pr.new/<fork>/...
  skip-fork-pr:
    name: Skip fork pull request
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.pull_request.state == 'open' &&
      contains(github.event.pull_request.labels.*.name, 'ci:canary') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:canary')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "::notice::Fork PRs are not published to pkg.pr.new/storybookjs/storybook. On the fork, install https://github.com/apps/pkg-pr-new and run publish-canary.yml. Install URLs will be https://pkg.pr.new/${HEAD_REPO}/storybook@<sha> (compact https://pkg.pr.new/storybook@<sha> URLs will 404)."

  publish-canary:
    name: Publish Canary Packages
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'ci:canary') &&
        (github.event.action != 'labeled' || github.event.label.name == 'ci:canary')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pull Request Head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # After checkout of PR head, ./ would run that tree's action.yml.
      - name: Setup Node.js and Install Dependencies
        uses: $/.github/actions/setup-node-and-install
        with:
          install-code-deps: true

      - name: Build
        working-directory: code
        run: yarn task --task compile --start-from=auto --no-link

      - name: Publish
        working-directory: scripts
        env:
          # Compact URLs resolve via the npm repository field (storybookjs/storybook).
          # A publish from any other GITHUB_REPOSITORY must use owner/repo URLs.
          PKG_PR_NEW_NO_COMPACT: ${{ github.repository != 'storybookjs/storybook' }}
        run: |
          extra=()
          if [ "$PKG_PR_NEW_NO_COMPACT" = true ]; then
            extra+=(--no-compact)
          fi

          # --yarn uses `yarn pack`, which rewrites leftover workspace: ranges
          # (npm pack leaves them; npm install then fails with EUNSUPPORTEDPROTOCOL).
          yarn workspaces list --json --no-private \
            | jq -j '"../" + .location + "\u0000"' \
            | xargs -0 -r yarn pkg-pr-new publish --yarn --no-template --comment=off \
              "${extra[@]}" --json=./pkg-pr-new-output.json

          test -s ./pkg-pr-new-output.json
          jq -er '.packages[] | select(.name == "create-storybook") | .name' ./pkg-pr-new-output.json >/dev/null
          jq -er '.packages[] | select(.name == "storybook") | .name' ./pkg-pr-new-output.json >/dev/null
          jq -er '.packages[] | select(.name == "@storybook/react-vite") | .name' ./pkg-pr-new-output.json >/dev/null

      # Continues in publish-canary-pr-body.yml: after this job completes, a
      # trusted workflow_run updates the PR body with canary install commands.
