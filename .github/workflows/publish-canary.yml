name: Publish Canary Packages

on:
  # Manual run from the Actions UI or `gh workflow run`. Select any branch.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-canary:
    name: Publish Canary Packages
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.state == 'open' &&
        contains(github.event.pull_request.labels.*.name, 'ci:canary') &&
        (github.event.action != 'labeled' || github.event.label.name == 'ci:canary')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Build Canary Release Status
        id: canary-status
        if: ${{ github.event_name == 'pull_request' }}
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "run_url=https://github.com/$REPOSITORY/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout Pull Request Head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: "Update Canary Release Heading: Pending"
        id: replace-canary-heading-pending
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ steps.canary-status.outputs.run_url }}
        run: |
          printf '## 🦋 Canary Release - ⏳ [Pending](%s)\n' "$RUN_URL" > "$RUNNER_TEMP/canary-heading.md"
          python3 .github/scripts/replace-pr-body-markers.py \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --marker CANARY_RELEASE_HEADING "$RUNNER_TEMP/canary-heading.md"

      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-and-install
        with:
          install-code-deps: true

      - name: Build
        working-directory: code
        run: yarn task --task compile --start-from=auto --no-link

      - name: Publish
        id: publish
        working-directory: scripts
        run: |
          yarn workspaces list --json --no-private \
            | jq -j '"../" + .location + "\u0000"' \
            | xargs -0 -r yarn pkg-pr-new publish --no-template --comment=off --json=./pkg-pr-new-output.json

          test -s ./pkg-pr-new-output.json

      - name: Build Canary Release Content
        id: canary-content
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: scripts
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          create_storybook_package_url=$(jq -r '.packages[] | select(.name == "create-storybook") | .url' ./pkg-pr-new-output.json)
          storybook_package_url=$(jq -r '.packages[] | select(.name == "storybook") | .url' ./pkg-pr-new-output.json)

          if [[ -z "$create_storybook_package_url" || "$create_storybook_package_url" == "null" ]]; then
            create_storybook_package_url="https://pkg.pr.new/storybookjs/storybook/create-storybook@$COMMIT_SHA"
          fi

          if [[ -z "$storybook_package_url" || "$storybook_package_url" == "null" ]]; then
            storybook_package_url="https://pkg.pr.new/storybookjs/storybook/storybook@$COMMIT_SHA"
          fi

          npx --yes "$create_storybook_package_url" --help >/dev/null
          npx --yes "$storybook_package_url" upgrade --help >/dev/null

          printf '## 🦋 Canary Release - 🚢 Released `%s`\n' "$storybook_package_url" > "$RUNNER_TEMP/canary-heading.md"

          {
            printf '%s\n' 'This pull request has been released as canary packages. Try it out in a new project or update an existing project with the commands below.'
            printf '%s\n' ''
            printf '%s\n' '```sh'
            printf '%s\n' '# For a new project'
            printf 'npx --yes %s\n' "$create_storybook_package_url"
            printf '%s\n' ''
            printf '%s\n' '# or for an existing project'
            printf 'npx --yes %s upgrade\n' "$storybook_package_url"
            printf '%s\n' '```'
          } > "$RUNNER_TEMP/canary-body.md"

      - name: Update Canary Release Heading and Body
        id: replace-pr-body
        if: ${{ github.event_name == 'pull_request' && steps.canary-content.outcome == 'success' }}
        continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/replace-pr-body-markers.py \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --marker CANARY_RELEASE_HEADING "$RUNNER_TEMP/canary-heading.md" \
            --marker CANARY_RELEASE_SECTION "$RUNNER_TEMP/canary-body.md"

      - name: "Update Canary Release Heading: Failed"
        id: replace-canary-heading-failed
        if: ${{ github.event_name == 'pull_request' && failure() && steps.publish.outcome != 'success' }}
        continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ steps.canary-status.outputs.run_url }}
        run: |
          printf '## 🦋 Canary Release - 💥 [Failed](%s)\n' "$RUN_URL" > "$RUNNER_TEMP/canary-heading.md"
          python3 .github/scripts/replace-pr-body-markers.py \
            --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" \
            --marker CANARY_RELEASE_HEADING "$RUNNER_TEMP/canary-heading.md"

      - name: Create Failure Comment on PR
        if: ${{ github.event_name == 'pull_request' && failure() && steps.publish.outcome != 'success' && steps.replace-pr-body.outcome != 'failure' }}
        continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body "Failed to publish canary packages for this pull request, triggered by @$TRIGGERING_ACTOR. See the failed workflow run at: https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
