name: Ecosystem QA

# Probes on a branch that is never merged. They run gutenberg in the QA sandbox with a stand-in for
# the agent and print where the memory of the runner is, to answer two questions:
# - stall: what does a runner do while a sandbox sits at its memory limit and the kernel ends
#   nothing, with the memory guard and without it?
# - vitest: what holds the memory that appears on the host, outside the sandbox, while the
#   project's Storybook tests run in Vitest browser mode, and does the runner hardening agent
#   have a part in it?

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Probe ${{ matrix.probe }}, guard ${{ matrix.guard }}, hardening ${{ matrix.harden }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { probe: stall, guard: 'off', harden: 'on' }
          - { probe: stall, guard: 'on', harden: 'on' }
          - { probe: vitest, guard: 'on', harden: 'on' }
          - { probe: vitest, guard: 'on', harden: 'off' }
    steps:
      - name: Harden the runner
        if: ${{ matrix.harden == 'on' }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install the ecosystem-qa workspace
        run: |
          corepack enable
          yarn workspaces focus ecosystem-qa

      - name: Build the sandbox image and the stand-in agents
        run: |
          docker build --build-arg AGENT_UID="$(id -u)" --build-arg AGENT_GID="$(id -g)" -t sb-ecosystem-qa ecosystem-qa
          docker build -t sb-ecosystem-qa-standin-stall ecosystem-qa/probe/standin-stall
          docker build -t sb-ecosystem-qa-standin-vitest ecosystem-qa/probe/standin-vitest

      # The sandbox of the stall probe is limited to the 6742 MB at which the build stalls. A second
      # container holds the rest, so that the host is left with what it has next to a full sandbox
      # of the usual size: about 960 MB.
      - name: Leave the host what it has next to a full sandbox
        if: ${{ matrix.probe == 'stall' }}
        run: |
          free -m
          echo 6742 > /tmp/qa-probe-limit-mb
          available=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
          ballast=$(( available - 6742 - 960 ))
          echo "holding $ballast MB in a second container"
          docker run -d --name ballast --entrypoint node sb-ecosystem-qa -e "const keep=[];for(let i=0;i<Math.floor($ballast/64);i++)keep.push(Buffer.alloc(64*2**20,1));setInterval(()=>{},1000)"
          sleep 30
          free -m

      - name: Run the probe
        env:
          CLAUDE_CODE_OAUTH_TOKEN: probe-not-a-credential
          QA_PROBE_GUARD: ${{ matrix.guard }}
          QA_PROBE: ${{ matrix.probe }}
        run: |
          # Where the memory of the host is, every 20 seconds, next to what the sandbox is charged.
          (
            while true; do
              box=$(docker ps --filter name=^sandcastle- --format '{{.Names}}' | head -n 1)
              echo "host $(date -u +%H:%M:%S): $(awk '/^(MemAvailable|AnonPages|Cached|Shmem|SUnreclaim|SReclaimable|KernelStack|PageTables|Mapped|SwapFree|Dirty|Writeback|Unevictable|Percpu|VmallocUsed):/ {printf "%s %d MB  ", $1, $2/1024}' /proc/meminfo)"
              echo "host largest: $(ps -eo rss=,pid=,user=,comm= --sort=-rss | head -n 6 | awk '{printf "%d MB %s %s (pid %s); ", $1/1024, $4, $3, $2}')"
              echo "host processes in sum: $(ps -eo rss= | awk '{s+=$1} END {printf "%d MB", s/1024}'); tmpfs: $(df -m --output=target,used -t tmpfs 2>/dev/null | awk 'NR>1 && $2>0 {printf "%s %s MB; ", $1, $2}')"
              if [ -n "$box" ]; then
                docker exec "$box" sh -c 'echo "sandbox charged: $(( $(cat /sys/fs/cgroup/memory.current) / 1048576 )) MB; $(grep -E "^(anon|file|shmem|inactive_file|active_file|kernel|slab|sock|file_mapped|file_dirty|unevictable|pagetables|percpu|vmalloc) " /sys/fs/cgroup/memory.stat | awk "{printf \"%s %d MB  \", \$1, \$2/1048576}")"' 2>/dev/null
              fi
              sleep 20
            done
          ) &
          node ecosystem-qa/run.ts --repo gutenberg --version 11.0.0-beta.2 --engine claude --sandbox docker \
            --tier extended --out "$RUNNER_TEMP/qa-result" --image "sb-ecosystem-qa-standin-$QA_PROBE"

      - name: Show the guard's log and the end of the test log
        if: ${{ always() }}
        run: |
          cat "$RUNNER_TEMP/qa-result/evidence/memory-guard.log" || echo "the guard ended nothing"
          tail -n 25 "$RUNNER_TEMP/qa-result/evidence/vitest.log" || true
          free -m

      - name: Upload the readings
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-${{ matrix.probe }}-guard-${{ matrix.guard }}-hardening-${{ matrix.harden }}
          path: |
            ${{ runner.temp }}/qa-result/result.json
            ${{ runner.temp }}/qa-result/run.log
            ${{ runner.temp }}/qa-result/evidence/host-samples.jsonl
            ${{ runner.temp }}/qa-result/evidence/memory-guard.log
            ${{ runner.temp }}/qa-result/evidence/memory-limit.txt
            ${{ runner.temp }}/qa-result/evidence/vitest.log
            ${{ runner.temp }}/qa-result/evidence/build.log
          retention-days: 7
