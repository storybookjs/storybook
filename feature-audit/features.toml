# Storybook feature map
#
# This file is the editable source of truth for the feature audit. Every leaf
# `[[feature]]` claims a set of repository paths via `include`/`exclude` globs
# (repo-root-relative, `**` = any depth, `*` = within one segment). A file is
# assigned to exactly one feature: when several match, the most specific
# pattern (most literal characters) wins. `compute_metrics.py` reports files
# that no feature claims and files claimed by more than one feature with the
# same specificity, so the map can be tightened iteratively.
#
# `usefulness` is a 1-4 judgement (1 low, 2 medium, 3 high, 4 mission-critical)
# with a one-line rationale. `reach` (0-1) is the estimated share of installs
# that exercise the feature, with its own one-line justification; when absent it
# is derived from npm downloads of the feature's packages. External signals
# (`issue_labels`, `npm`) link the feature to the captured data under signals/.
#
# Globs may name paths that no longer exist (e.g. code/addons/review/**); they
# contribute nothing to line counts but let churn from the last 12 months be
# attributed to the feature that absorbed them.

[meta]
commit = "db128150dc9"
captured = "2026-10-20"
scan_roots = ["code", "scripts", "agent-eval", "test-storybooks"]
churn_since = "2025-10-20"
churn_bulk_commit_threshold = 40 # commits touching more files are release/bulk edits and ignored

[weights]
# cost = src_loc
#      + test_loc × (test + stories + fixture loc)
#      + Σ over third-party deps of (dependency_base + dependency_per_release × min(releases_12mo, dependency_release_cap)
#                                     + dependency_stale_penalty if unpublished for dependency_stale_days or deprecated)
#      + fix_pr × severity-weighted bug-fix PRs + maintenance_pr × maintenance/build/dependency PRs + churn × raw commits
#      + internal_fan_out × number of other features this feature imports from
test_loc = 0.25
dependency_base = 150
dependency_per_release = 1.0
dependency_release_cap = 200
dependency_stale_penalty = 150
dependency_stale_days = 730
fix_pr = 120          # the 1x rate for a bug-fix PR (triage, review, release); multiplied by severity, see [churn]
maintenance_pr = 40   # dependency bumps, cleanups, build/CI changes
churn = 0             # raw commits; superseded by PR categories, kept as a knob
internal_fan_out = 0  # coupling term; reported as fan-in/fan-out regardless

[usefulness]
# Four hypotheses are computed side by side; see ranking.md.
# "Base" = how many times more valuable each usefulness level is than the level below it.
# Base 3: low 1, medium 3, high 9, mission-critical 27. Base 2: 1/2/4/8. Base 4: 1/4/16/64.
geometric_base = 3
geometric_bases_side_by_side = [2, 4]
# Reach is an explicit `reach` on the feature, else npm downloads of the feature's packages divided
# by downloads of `reach_reference_package`, else `reach_default` by score; floored at reach_floor.
reach_reference_package = "storybook"
reach_default = { "4" = 1.0, "3" = 0.5, "2" = 0.2, "1" = 0.05 }
reach_floor = 0.01
# Inherited usefulness: a feature inherits the highest score of any feature that genuinely depends
# on it. Importers listed here wire everything together (presets register every addon, the shell
# mounts every widget, the CLI/init/upgrade touch every package) and are ignored, as are
# maintainer-only features. An edge counts only with at least `inheritance_min_imports` import
# statements. Set `inheritance_transitive = false` for one-hop inheritance.
inheritance_exclude_importers = ["config-and-presets", "manager-shell", "cli-core", "init", "upgrade-automigrate", "dev-server", "static-build", "builder-manager", "addon-management", "telemetry"]
inheritance_min_imports = 3
inheritance_transitive = true
inheritance_ignore_same_group = true  # a sub-feature carved out of a parent must not inherit from it

[churn]
# PR label → category. Rules are tried in order; the first category whose labels (or subject
# patterns) match wins. Categories listed in ignore_categories are dropped entirely.
bulk_files_threshold = 60
ignore_categories = ["release"]
infer_category_from_issues = true  # an unlabelled PR that closes a bug-labelled issue counts as a fix
# Bug-fix PRs are weighted by their sev:* label (own label first, else the closed issue's);
# `fix_pr` in [weights] is the 1x rate. Unlabelled fixes count 1x.
severity_multipliers = { "sev:S1" = 4.0, "sev:S2" = 2.0, "sev:S3" = 1.0, "sev:S4" = 0.5, "none" = 1.0 }
categories = [
  { category = "release", labels = ["release"], subject_patterns = ["version-non-patch", "version-patch", "changeset-release"] },
  { category = "fix", labels = ["bug", "security", "performance issue", "flaky-test"] },
  { category = "feature", labels = ["feature request", "RFC:accepted", "RFC:implemented", "experiment"] },
  { category = "maintenance", labels = ["maintenance", "dependencies", "cleanup", "tech debt", "tech-debt", "technical debt", "refactoring", "build", "code-quality"] },
  { category = "docs", labels = ["documentation", "ci:docs"] },
]

# ---------------------------------------------------------------------------
# Macro groups
# ---------------------------------------------------------------------------

[[group]]
id = "preview"
name = "Story model & preview runtime"
description = "How stories are declared (CSF), parsed, indexed, loaded and rendered inside the preview iframe, including the per-framework renderers."

[[group]]
id = "docgen"
name = "Docgen & component metadata"
description = "Extracting props, types and descriptions from components for controls, docs and AI consumers."

[[group]]
id = "node"
name = "Node core: config, server, build"
description = "Loading .storybook config and presets, the dev server, static builds, the manager bundler and shared Node infrastructure."

[[group]]
id = "builders"
name = "Builders & frameworks"
description = "Vite and webpack builder integrations and the per-framework packages that glue renderer, builder and app-framework conventions together."

[[group]]
id = "manager"
name = "Manager UI"
description = "The Storybook shell: layout, sidebar, canvas toolbar, settings, theming and the shared component library."

[[group]]
id = "addons"
name = "Essential & bundled addons"
description = "Addons shipped in core (actions, controls, viewport, docs, ...) and the first-party addon packages."

[[group]]
id = "testing"
name = "Testing"
description = "Interaction testing, the Vitest addon and story-level test infrastructure."

[[group]]
id = "ai"
name = "AI & agent integration"
description = "MCP server, toolsets, the tools CLI, agent skills, agentic review and the evaluation harness."

[[group]]
id = "cli"
name = "CLI & lifecycle"
description = "storybook init/upgrade/add/doctor, automigrations, codemods and the ESLint plugin."

[[group]]
id = "repo"
name = "Repository tooling & test infrastructure"
maintainer_only = true
description = "Not user-facing: build scripts, sandbox templates, e2e suites and the internal Storybook."

