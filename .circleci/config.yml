version: 2.1

# https://circleci.com/docs/guides/orchestrate/dynamic-config/
setup: true

orbs:
  git-shallow-clone: guitarrapc/git-shallow-clone@2.8.0
  continuation: circleci/continuation@2.0.1
  nx: nrwl/nx@1.7.0

parameters:
  ghBaseBranch:
    default: next
    description: The name of the base branch (the target of the PR)
    type: string
  ghPrNumber:
    default: ''
    description: The PR number
    type: string
  ghTrustedAuthor:
    default: 'false'
    description: Whether the PR author is a trusted author who should be allowed to persist to shared caches
    type: string
  nxDte:
    default: false
    description: Run the workflow as one NX task graph distributed over CircleCI agents (scripts/ci/nx/circleci-dte.ts)
    type: boolean
  nxDteAffected:
    default: true
    description: When nxDte is set on a pull request, run only the tasks the change reaches (nx affected) instead of all of them
    type: boolean
  nxDteAgents:
    default: 20
    description: At most how many CircleCI agents start with the run when nxDte is set
    type: integer
  nxDtePeakAgents:
    default: 24
    description: At most how many more CircleCI agents join when the sandbox tasks become ready, when nxDte is set
    type: integer
  workflow:
    default: skipped
    description: Which workflows to run, comma-separated, out of daily, normal, focus, docs, windows (e.g. `normal,windows`)
    type: string

jobs:
  generate-and-run-config:
    docker:
      - image: cimg/node:22.22.3
    resource_class: large
    steps:
      # Only focus and the NX DTE pipeline (`nx affected`) diff against the base branch, so only
      # they pay for 100 commits of history.
      - when:
          condition:
            or:
              - matches:
                  pattern: '(.*,)?focus(,.*)?'
                  value: << pipeline.parameters.workflow >>
              - << pipeline.parameters.nxDte >>
          steps:
            - git-shallow-clone/checkout_advanced:
                clone_options: '--depth 100 --filter=blob:none --no-tags'
                fetch_options: '--depth 100 --filter=blob:none --no-tags'
                tag_fetch_options: '--no-tags'
            - run:
                name: Fetch base branch for focused CI
                environment:
                  GH_BASE_BRANCH: << pipeline.parameters.ghBaseBranch >>
                command: |
                  git fetch --depth=100 --filter=blob:none --no-tags origin \
                    "$GH_BASE_BRANCH:refs/remotes/origin/$GH_BASE_BRANCH"
                  if ! git merge-base "origin/$GH_BASE_BRANCH" HEAD >/dev/null; then
                    echo "No merge base found between origin/$GH_BASE_BRANCH and HEAD within 100 commits." >&2
                    exit 1
                  fi
      - unless:
          condition:
            or:
              - matches:
                  pattern: '(.*,)?focus(,.*)?'
                  value: << pipeline.parameters.workflow >>
              - << pipeline.parameters.nxDte >>
          steps:
            - git-shallow-clone/checkout_advanced:
                clone_options: '--depth 1'
                tag_fetch_options: '--no-tags'
      # The NX DTE pipeline sizes its agents to the tasks Nx will run (scripts/ci/nx/select.ts), so
      # this job installs (from the cache nx-main stores) and asks Nx. The key is circleci-dte.ts
      # `NODE_MODULES_KEY`; circleci-dte.test.ts keeps the two equal.
      - when:
          condition: << pipeline.parameters.nxDte >>
          steps:
            - run:
                name: Hash the package manifests
                command: cat package.json */package.json code/*/package.json code/*/*/package.json | sha256sum > /tmp/nx-dte-manifests.sha256
            - restore_cache:
                keys:
                  - v1-nx-dte-node_modules/{{ arch }}/{{ checksum ".nvmrc" }}/{{ checksum ".yarnrc.yml" }}/{{ checksum "yarn.lock" }}/{{ checksum ".nx/workflows/prune-other-platforms.cjs" }}/{{ checksum "scripts/ci/nx/circleci-node-modules.sh" }}/{{ checksum "/tmp/nx-dte-manifests.sha256" }}
            - run:
                name: Restore node_modules
                command: bash scripts/ci/nx/circleci-node-modules.sh restore /tmp/nx-dte-node_modules.tar.zst
            # After an install (a new lockfile), store the tree at once, so the main job and the
            # agents restore it instead of each installing. Only for trusted authors, as nx-main.
            - when:
                condition:
                  equal: ['true', << pipeline.parameters.ghTrustedAuthor >>]
                steps:
                  - run:
                      name: Pack node_modules
                      command: bash scripts/ci/nx/circleci-node-modules.sh pack /tmp/nx-dte-node_modules.tar.zst
                  - save_cache:
                      key: v1-nx-dte-node_modules/{{ arch }}/{{ checksum ".nvmrc" }}/{{ checksum ".yarnrc.yml" }}/{{ checksum "yarn.lock" }}/{{ checksum ".nx/workflows/prune-other-platforms.cjs" }}/{{ checksum "scripts/ci/nx/circleci-node-modules.sh" }}/{{ checksum "/tmp/nx-dte-manifests.sha256" }}
                      paths:
                        - /tmp/nx-dte-node_modules.tar.zst
            # NX_BASE and NX_HEAD for `nx affected`, as Nx's CircleCI recipe for manual DTE does: on a
            # pull request the merge base with the base branch.
            - nx/set-shas:
                main-branch-name: << pipeline.parameters.ghBaseBranch >>
            - run:
                name: Select the tasks to run
                environment:
                  GH_BASE_BRANCH: << pipeline.parameters.ghBaseBranch >>
                  GH_PR_NUMBER: << pipeline.parameters.ghPrNumber >>
                  NX_NO_CLOUD: 'true'
                  NX_DAEMON: 'false'
                command: |
                  # Only a pull request has a base to diff against; anything else runs every task.
                  # The parameter inline: a boolean in `environment` does not reach the step as `true`.
                  BASE=
                  if [ -n "$GH_PR_NUMBER" ] && [ "<< pipeline.parameters.nxDteAffected >>" = true ]; then
                    BASE=$NX_BASE
                  fi
                  echo "Pull request: ${GH_PR_NUMBER:-none}; nx affected since: ${BASE:-nothing, all tasks run}"
                  yarn exec jiti ./scripts/ci/nx/select.ts \
                    --workflow=<< pipeline.parameters.workflow >> \
                    --base-ref="origin/$GH_BASE_BRANCH" \
                    --base="$BASE" \
                    --out=/tmp/nx-dte-selection.json
            - store_artifacts:
                path: /tmp/nx-dte-selection.json
      - run:
          name: Generate config
          environment:
            GH_BASE_BRANCH: << pipeline.parameters.ghBaseBranch >>
          command: |
            node --experimental-transform-types ./scripts/ci/main.ts \
              --workflow=<< pipeline.parameters.workflow >> \
              --base-ref="origin/$GH_BASE_BRANCH" \
              --gh-trusted-author=<< pipeline.parameters.ghTrustedAuthor >> \
              --branch="<< pipeline.git.branch >>" \
              --nx-dte=<< pipeline.parameters.nxDte >> \
              --nx-dte-agents=<< pipeline.parameters.nxDteAgents >> \
              --nx-dte-peak-agents=<< pipeline.parameters.nxDtePeakAgents >> \
              $([ "<< pipeline.parameters.nxDte >>" = true ] && echo --nx-dte-selection=/tmp/nx-dte-selection.json)
      - continuation/continue:
          configuration_path: .circleci/config.generated.yml
workflows:
  setup:
    jobs:
      - generate-and-run-config
    when: pipeline.parameters.workflow != "skipped"
