approvedGitRepositories:
  - "**"

compressionLevel: 0

enableGlobalCache: true

enableScripts: true

installStatePath: ./.yarn/root-install-state.gz

logFilters:
  - code: YN0007
    level: discard
  - code: YN0005
    level: discard
  - code: YN0076
    level: discard

nodeLinker: node-modules

npmMinimalAgeGate: 10080

# TypeScript 7.1 and its platform binaries are younger than the age gate. Remove seven days after
# the stable 7.1.0 release, which the gate would hold back until then (tracked in PR #37004).
npmPreapprovedPackages:
  - "typescript"
  - "@typescript/typescript-*"

npmPublishAccess: public

npmRegistryServer: "https://registry.yarnpkg.com"

supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64
  os:
    - current
    - linux
    - darwin

tsEnableAutoTypes: true

unsafeHttpWhitelist:
  - localhost

yarnPath: .yarn/releases/yarn-4.18.0.cjs
