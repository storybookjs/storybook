<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var exp = {};
    (params.get('__exp') || '')
      .split(',')
      .filter(Boolean)
      .forEach(function (f) {
        exp[f] = true;
      });
    window.__SB_EXP__ = exp;

    var trace = [];
    window.__sbTrace = trace;
    function se() {
      return document.scrollingElement || document.documentElement;
    }
    function log(type, detail) {
      var s = se();
      trace.push({
        t: Math.round(performance.now() * 10) / 10,
        type: type,
        d: detail == null ? '' : String(detail).slice(0, 160),
        y: s ? s.scrollTop : -1,
        h: s ? s.scrollHeight : -1,
        cls: document.body ? document.body.className : '',
      });
    }
    window.__probeLog = log;
    log('boot', (performance.getEntriesByType('navigation')[0] || {}).type + ' exp=' + JSON.stringify(exp));

    window.addEventListener(
      'scroll',
      function () {
        log('scrollEvent');
      },
      { capture: true, passive: true }
    );

    var lastY = -1,
      lastH = -1;
    (function raf() {
      var s = se();
      if (s) {
        var y = s.scrollTop,
          h = s.scrollHeight;
        if (y !== lastY || h !== lastH) {
          log('frame', 'y ' + lastY + '->' + y + ', h ' + lastH + '->' + h);
          lastY = y;
          lastH = h;
        }
      }
      requestAnimationFrame(raf);
    })();

    function startObservers() {
      var mo = new MutationObserver(function (muts) {
        muts.forEach(function (m) {
          if (m.type === 'attributes') {
            log(
              'attr',
              (m.target.id || m.target.nodeName) +
                ' ' +
                m.attributeName +
                '="' +
                (m.target.getAttribute(m.attributeName) || '') +
                '"'
            );
          } else {
            log('dom', (m.target.id || m.target.nodeName) + ' +' + m.addedNodes.length + '/-' + m.removedNodes.length);
          }
        });
      });
      mo.observe(document.body, { attributes: true, attributeFilter: ['class'], childList: true });
      var root = document.getElementById('storybook-root');
      if (root) {
        mo.observe(root, { childList: true, attributes: true, attributeFilter: ['hidden'] });
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startObservers);
    } else {
      startObservers();
    }

    (function hookChannel() {
      var ch = window.__STORYBOOK_ADDONS_CHANNEL__;
      if (!ch || !ch.on) {
        return setTimeout(hookChannel, 50);
      }
      [
        'storyRenderPhaseChanged',
        'storyRendered',
        'storyChanged',
        'storyUnchanged',
        'setCurrentStory',
        'storyIndexInvalidated',
        'storyPrepared',
        'storyMissing',
        'storyThrewException',
      ].forEach(function (ev) {
        ch.on(ev, function (a) {
          log('channel:' + ev, a && a.newPhase ? a.newPhase : typeof a === 'string' ? a : '');
        });
      });
      log('channelHooked');
    })();
  })();
</script>
