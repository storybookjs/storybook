# NX Cloud CI configuration, read by `npx nx-cloud start-workers` in .github/workflows/nx.yml.
# Launch templates (machines and their init steps) live in .nx/workflows/agents.yaml.
# See https://nx.dev/docs/reference/nx-cloud/ci-config
dte:
  # The NX Cloud Team plan allows at most 20 workers per run; NX Cloud rejects the whole run above it.
  # One worker type: every worker can run every task, so none sits idle waiting for a task type.
  distribute-on:
    small-changeset: 6 linux-browsers-js # 1-25% of projects affected
    medium-changeset: 12 linux-browsers-js # 26-50%
    large-changeset: 16 linux-browsers-js # 51-75%
    extra-large-changeset: 20 linux-browsers-js # 76-100%
  # One task per worker at a time (plus the continuous dev, serve and run-registry tasks that task
  # needs). The sandbox tasks share one folder per template outside the workspace, and each restores
  # it from the cache first; the Playwright and Vitest runs all write to {workspaceRoot}/test-results.
  # Dynamic task packing (NX_CLOUD_AUTO_TASK_PACKING) needs `scheduling-constraints` for that instead,
  # but in our runs it left an e2e task queued behind a finished one for minutes, so it stays off.
  assignment-rules:
    - targets:
        - '*'
      run-on:
        - agent: linux-browsers-js
          parallelism: 1
# No lifecycle.stop-after: NX Cloud tracks the main job (heartbeat) and stops the workers when it
# ends. A stop-after list that misses a target strands queued tasks (for example the continuous
# serve, dev and run-registry tasks) and the run hangs.
