name: nx

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened]
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  nx:
    # Same-repo PRs only: fork PRs get no secrets, so they cannot reach Nx Cloud.
    # A `labeled` event only starts a run for `ci:normal` or `ci:daily`, so adding any other
    # label does not restart the whole pipeline.
    if: >
      github.repository == 'storybookjs/storybook' &&
        ((github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.action != 'labeled' || github.event.label.name == 'ci:normal' || github.event.label.name == 'ci:daily') &&
          (contains(github.event.pull_request.labels.*.name, 'ci:normal') ||
           contains(github.event.pull_request.labels.*.name, 'ci:daily'))
        ) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    # Job-level (not workflow-level) so a skipped run, such as an unrelated label, never
    # cancels the run in progress. A new push supersedes the previous run of the same PR.
    # Scheduled and manual runs each get their own group, so they never cancel each other.
    concurrency:
      group: nx-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true

    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      ALL_TASKS: compile,check,knip,test,lint,fmt,sandbox,build,e2e-tests,e2e-tests-dev,vitest-integration,check-sandbox,e2e-ui,jest,vitest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false
      - name: Set Nx tag(s)
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DAILY: ${{ contains(github.event.pull_request.labels.*.name, 'ci:daily') }}
        run: |
          tags="normal"
          if [[ "$EVENT_NAME" == "pull_request" && "$IS_DAILY" == "true" ]]; then
            tags="daily"
          fi
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            tags="daily"
          fi
          echo "tag=$tags" >> "$GITHUB_OUTPUT"
      - name: Select distribution config
        id: dist
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ "$TAG" == "daily" ]]; then
            echo "config=./.nx/workflows/distribution-config-daily.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "config=./.nx/workflows/distribution-config.yaml" >> "$GITHUB_OUTPUT"
          fi
      - env:
          DIST_CONFIG: ${{ steps.dist.outputs.config }}
        run: npx nx-cloud@19.1.5 start-ci-run --distribute-on="$DIST_CONFIG" --stop-workers-after="$ALL_TASKS"
      - name: Create Nx Cloud Status (pending)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: | # zizmor: ignore[template-injection] safe toJson context expansion in github-script
            const tag = ${{ toJson(steps.tag.outputs.tag) }} || 'normal';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request?.head?.sha ?? context.sha,
              state: 'pending',
              target_url: `https://cloud.nx.app/orgs/606dcb5cdc2a2b00059cc0e9/workspaces/6929fbef73e98d8094d2a343/overview?branch=${
                context.payload.pull_request?.number ?? 'next'
              }`,
              description: 'NX Cloud is running your tests',
              context: `nx: ${tag}`,
            });
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install --immutable
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - id: nx
        name: 'Run nx'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo 'nx_output<<EOF' >> "$GITHUB_OUTPUT"
          yarn nx run-many -t $ALL_TASKS -c production -p="tag:library,tag:ci:${TAG}" | tee -a "$GITHUB_OUTPUT"
          status=${PIPESTATUS[0]}
          echo 'EOF' >> "$GITHUB_OUTPUT"
          exit $status

      # Not on cancellation: a superseded run must not overwrite the status of the run that replaced it.
      - name: Create per-task Nx statuses
        if: ${{ !cancelled() }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          NX_OUTCOME: ${{ steps.nx.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: | # zizmor: ignore[template-injection] safe toJson context expansion in github-script
            const raw = ${{ toJson(steps.nx.outputs.nx_output) }} || '';
            const tag = ${{ toJson(steps.tag.outputs.tag) }} || '';
            // `success` only when the nx step itself succeeded. A failure before it (for example
            // NX Cloud rejecting the run) leaves the output empty, which must not read as green.
            const succeeded = process.env.NX_OUTCOME === 'success';
            const lines = raw.split('\n');
            const failures = [];

            for (const [i, line] of lines.entries()) {
              if (!line.includes('✖')) continue;

              const task =
                line.match(/✖\s+([^│]+?)\s{2,}/)?.[1].trim() ||
                'Unknown Nx task';

              // Nx 24 prints `> Logs: https://cloud.nx.app/runs/<run>/task/<task>` under a failed task.
              const url = lines
                .slice(i + 1, i + 6)
                .find(l => /Logs:/.test(l))
                ?.match(/Logs:\s*(https:\/\/cloud\.nx\.app\/\S+)/)?.[1];

              failures.push({ task, url });
            }

            const sha = context.payload.pull_request?.head?.sha ?? context.sha;

            // Per-task statuses (max 5)
            for (const { task, url } of failures.slice(0, 5)) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: 'failure',
                target_url: url ?? undefined,
                context: `nx run ${task}`,
                description: 'Your test failed on NX Cloud',
              });
            }

            // Prefer the pipeline execution link, then a run link; never a single task's log.
            const cloudLinks = (raw.match(/https:\/\/cloud\.nx\.app\/\S+/g) ?? []).filter(
              (link) => !link.includes('/task/')
            );
            const nxCloudUrl =
              cloudLinks.find((link) => link.includes('/cipes/')) ??
              cloudLinks.filter((link) => link.includes('/runs/')).at(-1) ??
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const failedCount = failures.length;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: succeeded ? 'success' : 'failure',
              target_url: nxCloudUrl,
              description: succeeded
                ? 'Nx Cloud run finished successfully'
                : failedCount
                  ? `Nx Cloud run failed (${failedCount} tasks failed)`
                  : 'Nx Cloud run failed before or outside its tasks',
              context: `nx: ${tag}`,
            });
