nodeLinker: node-modules
enableImmutableInstalls: false
# Next.js 16.4, which vitest-plugin-rsc needs, and the releases its dependencies need, are younger
# than the age gate of the repository. Remove these once they are older, after 2026-10-14.
npmPreapprovedPackages:
  - next
  - '@next/*'
  - '@vitejs/plugin-rsc'
  - cjs-module-lexer
  - es-module-lexer
  - magic-string
yarnPath: ../../.yarn/releases/yarn-4.18.0.cjs
