# Assignment rules for the CircleCI agents of the NX DTE pipeline (scripts/ci/nx/circleci-dte.ts),
# which starts NX Cloud with `start-ci-run --distribute-on=manual`. The agents set
# NX_AGENT_LAUNCH_TEMPLATE to the agent name below. Each agent runs one task at a time (plus the
# continuous tasks that task needs): two tasks of one sandbox on an agent break each other, as each
# first restores the sandbox folder from the cache, and they share test-results. Packing tasks onto
# an agent was tried: it queued an E2E task behind a finished one for minutes.
# https://nx.dev/docs/reference/nx-cloud/assignment-rules
assignment-rules:
  - targets:
      - '*'
    run-on:
      - agent: circleci-linux
        parallelism: 1
