approvedGitRepositories:
  - "**"

compressionLevel: 0

enableGlobalCache: true

enableScripts: true

installStatePath: ./.yarn/root-install-state.gz

logFilters:
  - code: YN0007
    level: discard
  - code: YN0005
    level: discard
  - code: YN0076
    level: discard

nodeLinker: node-modules

npmMinimalAgeGate: 10080

# Exact versions exempt from the age gate. Remove an entry once it is older than the gate.
npmPreapprovedPackages:
  - "vitest@5.1.0"
  - "@vitest/browser@5.1.0"
  - "@vitest/browser-playwright@5.1.0"
  - "@vitest/coverage-istanbul@5.1.0"
  - "@vitest/coverage-v8@5.1.0"
  - "@vitest/expect@5.1.0"
  - "@vitest/mocker@5.1.0"
  - "@vitest/pretty-format@5.1.0"
  - "@vitest/runner@5.1.0"
  - "@vitest/snapshot@5.1.0"
  - "@vitest/spy@5.1.0"
  - "@vitest/ui@5.1.0"
  - "@vitest/utils@5.1.0"
  - "@vitest/istanbul-lib-coverage@2.1.0"
  - "@vitest/istanbul-lib-instrument@2.1.0"
  - "@vitest/istanbul-lib-report@2.1.0"
  - "@vitest/istanbul-lib-source-maps@2.1.0"

npmPublishAccess: public

npmRegistryServer: "https://registry.yarnpkg.com"

supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64
  os:
    - current
    - linux
    - darwin

tsEnableAutoTypes: true

unsafeHttpWhitelist:
  - localhost

yarnPath: .yarn/releases/yarn-4.18.0.cjs
