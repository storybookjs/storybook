# Assignment rules for the Windows agents of the NX DTE pipeline (scripts/ci/nx/circleci-dte.ts),
# whose run `nx-main-windows` starts with `NX_CI_EXECUTION_ENV=windows`. The agents set
# NX_AGENT_LAUNCH_TEMPLATE to the agent name below. One task at a time, as on Linux
# (circleci-assignment-rules.yaml).
# https://nx.dev/docs/reference/nx-cloud/assignment-rules
assignment-rules:
  - targets:
      - '*'
    run-on:
      - agent: circleci-windows
        parallelism: 1
