name: Agent eval

on:
  schedule:
    # Weekly full 8xx/82x suite on `next` (repo default). Monday 08:00 UTC.
    - cron: '0 8 * * 1'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  workflow_dispatch:
    inputs:
      eval_only:
        description: 'Comma-separated eval names to run (overrides extra_evals), e.g. 803-edit-component'
        type: string
        default: ''
      extra_evals:
        description: 'Run the full 8xx eval line instead of only the default eval'
        type: boolean
        default: false
      extra_models:
        description: 'Also run evals for non-default model experiments (e.g. cc-plugin-sonnet-medium)'
        type: boolean
        default: false
      storybook_latest:
        description: 'Install Storybook and @storybook/addon-mcp from the npm latest tag instead of the next tag and local build'
        type: boolean
        default: false
      review:
        description: 'Enable the experimentalReview feature flag in eval sandboxes and assert the review workflow'
        type: boolean
        default: false

concurrency:
  group: agent-eval-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_PROJECT_NAME: storybook-evals

jobs:
  # Keep `ci:eval` sticky as the "this PR needs evals" marker. New pushes
  # invalidate prior green without re-spending; re-run by remove+re-add
  # `ci:eval` or workflow_dispatch.
  invalidate-evals-ok:
    name: Invalidate evals:ok on new commits
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      !github.event.pull_request.head.repo.fork &&
      contains(github.event.pull_request.labels.*.name, 'ci:eval') &&
      contains(github.event.pull_request.labels.*.name, 'evals:ok')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Remove stale evals:ok
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label 'evals:ok'

  eval:
    name: Run agent eval experiments
    # Skip synchronize: sticky `ci:eval` must not re-bill on every push.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.action != 'synchronize' &&
        !github.event.pull_request.head.repo.fork &&
        contains(github.event.pull_request.labels.*.name, 'ci:eval'))
    runs-on: ubuntu-latest
    environment:
      # Keep this rule in sync with the Resolve Vercel target step below.
      # GitHub evaluates environment.name before step outputs exist.
      name: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/next' && 'production' || 'preview' }}
      url: ${{ steps.deploy_playground.outputs.url }}
    permissions:
      contents: read
      deployments: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Clear prior evals:ok
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -Fxq 'evals:ok'; then
            gh pr edit "$PR_NUMBER" --remove-label 'evals:ok'
          fi

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build local MCP packages
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: yarn nx run-many -t compile --projects mcp,addon-mcp

      - name: Type check agent eval config
        run: yarn workspace agent-eval run typecheck

      - name: Check playground route shims
        run: yarn workspace agent-eval run playground:check-routes

      - name: Validate Vercel credentials
        shell: bash
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          missing=0

          for name in VERCEL_PROJECT_ID VERCEL_TOKEN VERCEL_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing Vercel secret::$name is required for Vercel Sandbox evals and the preview playground deployment."
              missing=1
            fi
          done

          exit "$missing"

      - name: Run all experiments
        id: run_evals
        run: yarn workspace agent-eval run eval
        env:
          # Schedule always runs the full 8xx/82x line on next. PR labels and
          # workflow_dispatch inputs opt in otherwise; unlabeled ci:eval stays minimal.
          EVAL_ONLY: ${{ inputs.eval_only || '' }}
          EVAL_EXTRA_EVALS: ${{ (github.event_name == 'schedule' || inputs.extra_evals || contains(github.event.pull_request.labels.*.name, 'ci:extra-evals')) && '1' || '' }}
          EVAL_EXTRA_MODELS: ${{ (inputs.extra_models || contains(github.event.pull_request.labels.*.name, 'ci:extra-models')) && '1' || '' }}
          EVAL_STORYBOOK_LATEST: ${{ (inputs.storybook_latest || contains(github.event.pull_request.labels.*.name, 'ci:storybook-latest')) && '1' || '' }}
          EVAL_REVIEW: ${{ (inputs.review || contains(github.event.pull_request.labels.*.name, 'ci:review')) && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Check eval results
        if: ${{ always() }}
        id: check_results
        shell: bash
        run: |
          if [[ ! -d agent-eval/results ]]; then
            echo "::error title=Missing eval results::Expected agent-eval/results to exist before deploying the playground."
            exit 1
          fi

          if ! find agent-eval/results -type f -print -quit | grep -q .; then
            echo "::error title=No eval result files::Expected agent-eval/results to contain files before deploying the playground."
            exit 1
          fi

          echo "has_result_files=true" >> "$GITHUB_OUTPUT"

      - name: Archive eval results
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' }}
        # Tar before upload: result files may contain characters (e.g. the colon
        # in test:stories output names) that actions/upload-artifact rejects.
        run: tar -czf agent-eval-results.tgz -C agent-eval results

      - name: Upload eval results
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-eval-results
          path: agent-eval-results.tgz
          retention-days: 30

      - name: Resolve Vercel target
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' }}
        id: vercel_target
        shell: bash
        run: |
          # Keep this rule in sync with jobs.eval.environment.name above.
          if [[ ("$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "schedule") && "$GITHUB_REF" == "refs/heads/next" ]]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
          fi

      # Vercel CLI commands run from the repository root: the storybook-evals
      # project's Root Directory setting is agent-eval, and in a monorepo the
      # CLI must not be invoked from the subdirectory (vercel.com/docs/monorepos)
      # or `deploy --prebuilt` resolves trace paths against the wrong base.
      - name: Link Vercel project
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: ./agent-eval/node_modules/.bin/vercel link --yes --team "$VERCEL_TEAM_ID" --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN"

      - name: Pull Vercel environment
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' }}
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TARGET: ${{ steps.vercel_target.outputs.target }}
        run: |
          if [[ "$VERCEL_TARGET" == "production" ]]; then
            ./agent-eval/node_modules/.bin/vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          else
            branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            ./agent-eval/node_modules/.bin/vercel pull --yes --environment=preview --git-branch "$branch" --token "$VERCEL_TOKEN"
          fi

      - name: Build playground
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' }}
        id: build_playground
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TARGET: ${{ steps.vercel_target.outputs.target }}
        run: ./agent-eval/node_modules/.bin/vercel build --yes --target="$VERCEL_TARGET" --token "$VERCEL_TOKEN"

      - name: Deploy playground
        if: ${{ always() && steps.check_results.outputs.has_result_files == 'true' && steps.build_playground.outcome == 'success' }}
        id: deploy_playground
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TARGET: ${{ steps.vercel_target.outputs.target }}
        run: |
          deploy_output="$(./agent-eval/node_modules/.bin/vercel deploy --prebuilt --yes --target="$VERCEL_TARGET" --token "$VERCEL_TOKEN")"
          printf '%s\n' "$deploy_output"

          url="$(
            printf '%s\n' "$deploy_output" |
              awk '/https:\/\/[^[:space:]]+\.vercel\.app/ { match($0, /https:\/\/[^[:space:]]+\.vercel\.app[^[:space:]]*/); if (RSTART) found=substr($0,RSTART,RLENGTH) } END { print found }'
          )"

          if [[ -z "$url" ]]; then
            echo "::error title=Missing deployment URL::Vercel deploy did not print a deployment URL."
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Update PR description with eval results
        if: ${{ always() && github.event_name == 'pull_request' && steps.check_results.outputs.has_result_files == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PLAYGROUND_URL: ${{ steps.deploy_playground.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary="$(node agent-eval/scripts/render-results-summary.mjs)"
          body="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')"

          printf '%s' "$body" |
            SUMMARY="$summary" node agent-eval/scripts/upsert-pr-eval-results.mjs |
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --field body=@- --silent

      - name: Write deployment summary
        if: ${{ always() && steps.deploy_playground.outcome == 'success' }}
        env:
          VERCEL_TARGET: ${{ steps.vercel_target.outputs.target }}
          PLAYGROUND_URL: ${{ steps.deploy_playground.outputs.url }}
        run: |
          {
            echo "### Agent eval playground"
            echo
            echo "- Target: \`$VERCEL_TARGET\`"
            echo "- Project: \`$VERCEL_PROJECT_NAME\`"
            echo "- URL: $PLAYGROUND_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # Sticky `ci:eval` = evals required. `evals:ok` = this head's eval run passed.
      # Danger blocks merge when `ci:eval` is present without `evals:ok`.
      # Tied to the eval step, not playground deploy (deploy can fail independently).
      - name: Mark evals:ok
        if: ${{ github.event_name == 'pull_request' && steps.run_evals.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create 'evals:ok' \
            --color '0E8A16' \
            --description 'Agent eval run passed for the current PR head' \
            2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label 'evals:ok'

      # Weekly / next-dispatch signal to #sb-skills. Requires repo secret
      # SLACK_AGENT_EVAL_WEBHOOK_URL (Incoming Webhook into that channel).
      - name: Notify Slack
        if: >-
          always() &&
          !cancelled() &&
          (github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/next'))
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_AGENT_EVAL_WEBHOOK_URL }}
          PLAYGROUND_URL: ${{ steps.deploy_playground.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVAL_OUTCOME: ${{ steps.run_evals.outcome }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::warning title=Missing Slack webhook::SLACK_AGENT_EVAL_WEBHOOK_URL is not set; skipping #sb-skills notify."
            exit 0
          fi

          text="$(FORMAT=slack node agent-eval/scripts/render-results-summary.mjs)"
          payload="$(jq -n --arg text "$text" '{text: $text}')"
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
