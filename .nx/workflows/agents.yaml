# Launch templates for the NX Cloud workers that `.github/workflows/nx.yml` starts.
# Based on https://github.com/nrwl/nx-cloud-workflows/blob/main/launch-templates/linux.yaml
# Options: https://nx.dev/docs/reference/nx-cloud/launch-templates
linux-browsers-init-steps: &linux-browsers-init-steps
  - name: Checkout
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml'
  # The installed tree itself, not only the yarn cache: with a hit, the workers skip `yarn install`
  # (1.5 to 7 minutes per worker on a cold install). Only runs with the read-write token (`next`)
  # store it; pull requests restore the entry `next` stored for the same lockfile.
  #
  # The paths are listed one by one, without globs: the cache step keys its entry on the path list
  # as written before the restore and as expanded after the run, so a glob such as
  # `code/*/node_modules` stores the entry under a key that no restore ever asks for.
  # The install step below checks that every node_modules directory came back, and installs from
  # scratch when one is missing, so a directory missing from this list costs time, never a broken run.
  - name: Restore node_modules
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
    inputs:
      key: '"node-modules-v1"|.nvmrc|.yarnrc.yml|yarn.lock|.yarn/patches/**'
      paths: |
        node_modules
        agent-eval/node_modules
        code/node_modules
        code/addons/a11y/node_modules
        code/addons/vitest/node_modules
        code/builders/builder-vite/node_modules
        code/core/node_modules
        code/frameworks/angular/node_modules
        code/frameworks/angular-vite/node_modules
        code/frameworks/ember/node_modules
        code/frameworks/nextjs/node_modules
        code/lib/cli-sb/node_modules
        code/lib/vite-plugin-storybook-nextjs/node_modules
        code/renderers/react/node_modules
        code/renderers/svelte/node_modules
        code/renderers/web-components/node_modules
        scripts/node_modules
      # TEMPORARY: PR #37189 restores the entry its write-token dispatch stored, until `next` stores
      # one. Back to 'next' before merging.
      base-branch: 'kasper/nx-cloud-fast-ci'
  - name: Restore Browser Binary Cache
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
    inputs:
      key: '"browsers"|yarn.lock|.yarn/patches/**'
      paths: |
        ~/.cache/ms-playwright
      base-branch: 'next'
  - name: Install Node
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-node/main.yaml'
  - name: Install Node Modules
    # The cache key above covers the lockfile, so a restored tree is exactly what `yarn install`
    # would produce, as long as every node_modules directory it created came back. Running
    # `yarn install` on it anyway would first download the whole yarn cache (3 GB) to verify it.
    script: |
      set -eu
      list=node_modules/.nx-cloud-node-modules-dirs
      restored() {
        [ -f "$list" ] || return 1
        while read -r dir; do
          if [ ! -d "$dir" ]; then
            echo "Restored node_modules lacks $dir; add it to the cache paths in .nx/workflows/agents.yaml."
            return 1
          fi
        done < "$list"
      }
      if restored; then
        echo "node_modules restored from the cache; skipping yarn install."
      else
        yarn install --immutable
        find . -path ./node_modules -prune -o -name node_modules -type d -prune -print > "$list"
        echo ./node_modules >> "$list"
      fi
  - name: Clean stale Storybook packages from yarn cache
    # NX Cloud agents use the global yarn cache (enableGlobalCache: true) to
    # avoid duplicating .yarn/cache across sandboxes. However, sandboxes install
    # @storybook/* packages from a local verdaccio registry using the same
    # version number but different contents on each run. The global cache may
    # hold a stale copy from a previous pipeline, causing `yarn install` to
    # silently use the published version instead of the local verdaccio build.
    # Purging these entries forces yarn to fetch fresh copies from verdaccio.
    # TODO: publish unique versions to verdaccio so this workaround is unnecessary.
    script: |
      rm -f ~/.yarn/berry/cache/storybook-npm-*.zip 2>/dev/null || true
      rm -f ~/.yarn/berry/cache/@storybook-*.zip 2>/dev/null || true
  - name: Install Browsers
    script: |
      yarn exec playwright install chromium --with-deps
  - name: Verify
    script: |
      echo "node:         $(node --version)"
      echo "yarn:         $(yarn --version)"
      echo "home:         $HOME"
      git diff --exit-code

common-env-vars: &common-env-vars
  STORYBOOK_DISABLE_TELEMETRY: true
  IN_STORYBOOK_SANDBOX: true
  STORYBOOK_SANDBOX_ROOT: ../storybook-sandboxes
  STORYBOOK_NX_CLOUD_AGENT: true
  CI: true
  NODE_OPTIONS: --max_old_space_size=6144
  # Playwright runs 2 workers on CI unless told otherwise (code/playwright.config.ts). 6 suits the
  # static builds (e2e-tests) on these 8 vCPU workers, as on CircleCI's xlarge machines. Against a dev
  # server 6 timed out, so the e2e-tests-dev target sets 4 in nx.json.
  PLAYWRIGHT_WORKERS: 6

launch-templates:
  linux-browsers-js:
    # extra_large (8 vCPU): on large (4 vCPU) a worker died mid-run and NX Cloud cancelled the
    # whole pipeline.
    resource-class: 'docker_linux_amd64/extra_large'
    image: 'ubuntu22.04-node20.19-v2'
    init-steps: *linux-browsers-init-steps
    env: *common-env-vars
  windows-js:
    resource-class: 'windows/medium'
    image: 'windows-2022'
    # TODO init-steps:
    env: *common-env-vars
