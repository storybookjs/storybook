# copied from https://github.com/nrwl/nx-cloud-workflows/blob/main/launch-templates/linux.yaml
# see https://github.com/nrwl/nx/blob/master/.nx/workflows/agents.yaml for inspiration
linux-init-steps: &linux-init-steps
  - name: Checkout
    uses: 'nrwl/nx-cloud-workflows/v5/workflow-steps/checkout/main.yaml'
  # The pnpm store at its default Linux location, which the sandbox installs on the agent share.
  # The Verify step prints the store path pnpm actually uses.
  - name: Restore Node Modules Cache
    uses: 'nrwl/nx-cloud-workflows/v5/workflow-steps/cache/main.yaml'
    inputs:
      key: 'pnpm-lock.yaml|pnpm-workspace.yaml|patches/**'
      paths: |
        ~/.local/share/pnpm/store
      base-branch: 'next'
  - name: Install Node
    uses: 'nrwl/nx-cloud-workflows/v5/workflow-steps/install-node/main.yaml'
  # corepack runs the pnpm release pinned by the packageManager field in package.json.
  - name: Install Node Modules
    script: |
      corepack enable pnpm
      # corepack only replaces the shims in its own directory; a pnpm earlier on PATH would run unpinned.
      test "$(pnpm --version)" = "$(node -p "require('./package.json').packageManager.replace(/^pnpm@|\\+.*$/g, '')")"
      pnpm install --frozen-lockfile

linux-browsers-init-steps: &linux-browsers-init-steps
  - name: Checkout
    uses: 'nrwl/nx-cloud-workflows/v5/workflow-steps/checkout/main.yaml'
  # Sandboxes install the @storybook/* packages from a local registry that republishes the same
  # versions with new contents on each pipeline. The global Yarn cache could serve a stale copy
  # from a previous pipeline, so its @storybook entries were purged before installing. No purge
  # is needed for pnpm: the store indexes packages by tarball integrity, so a republished package
  # is a new store entry, and the sandbox setup drops pnpm's cached registry metadata for these
  # packages before each install. Keep pnpm's metadata cache (~/.cache/pnpm) out of these paths.
  - name: Restore Node Modules Cache
    uses: 'nrwl/nx-cloud-workflows/v5/workflow-steps/cache/main.yaml'
    inputs:
      key: 'pnpm-lock.yaml|pnpm-workspace.yaml|patches/**'
      paths: |
        ~/.local/share/pnpm/store
      base-branch: 'next'
  - name: Restore Browser Binary Cache
    uses: 'nrwl/nx-cloud-workflows/v5/workflow-steps/cache/main.yaml'
    inputs:
      key: '"browsers"|pnpm-lock.yaml|patches/**'
      paths: |
        ~/.cache/ms-playwright
      base-branch: 'next'
  - name: Install Node
    uses: 'nrwl/nx-cloud-workflows/v5/workflow-steps/install-node/main.yaml'
  - name: Install Node Modules
    script: |
      corepack enable pnpm
      # corepack only replaces the shims in its own directory; a pnpm earlier on PATH would run unpinned.
      test "$(pnpm --version)" = "$(node -p "require('./package.json').packageManager.replace(/^pnpm@|\\+.*$/g, '')")"
      pnpm install --frozen-lockfile
  - name: Install Browsers
    script: |
      pnpm exec playwright install chromium --with-deps
  - name: Verify
    script: |
      echo "node:         $(node --version)"
      echo "pnpm:         $(pnpm --version)"
      echo "pnpm store:   $(pnpm store path)"
      echo "home:         $HOME"
      git diff --exit-code
      # No `pnpm dedupe --check`: it also fails once newer versions in range pass the release-age
      # gate. CircleCI runs it on pull requests that change pnpm-lock.yaml.

common-env-vars: &common-env-vars
  STORYBOOK_DISABLE_TELEMETRY: true
  IN_STORYBOOK_SANDBOX: true
  STORYBOOK_SANDBOX_ROOT: ../storybook-sandboxes
  CI: true
  NODE_OPTIONS: --max_old_space_size=6144

launch-templates:
  linux-js:
    # see for options: https://nx.dev/docs/reference/nx-cloud/launch-templates#launch-templatestemplate-nameresource-class
    resource-class: 'docker_linux_amd64/extra_large+'
    image: 'ubuntu22.04-node20.19-v2'
    init-steps: *linux-init-steps
    env: *common-env-vars
  linux-browsers-js:
    resource-class: 'docker_linux_amd64/extra_large+'
    image: 'ubuntu22.04-node20.19-v2'
    init-steps: *linux-browsers-init-steps
    env: *common-env-vars
  windows-js:
    resource-class: 'windows/medium'
    image: 'windows-2022'
    # TODO init-steps:
    env: *common-env-vars
