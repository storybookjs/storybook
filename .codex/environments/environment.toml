version = 1
name = "storybook"

[setup]
script = "corepack enable && pnpm install && pnpm exec nx run-many -t compile"

[[actions]]
name = "Compile"
icon = "tool"
command = "pnpm exec nx run-many -t compile"

[[actions]]
name = "Check"
icon = "tool"
command = "pnpm exec nx run-many -t check"

[[actions]]
name = "Unit Tests"
icon = "test"
command = "pnpm test"

[[actions]]
name = "Internal UI"
icon = "run"
command = "pnpm --dir code storybook:ui"

[[actions]]
name = "Format"
icon = "tool"
command = "pnpm fmt:write"
